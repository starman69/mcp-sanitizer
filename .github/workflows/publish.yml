name: Publish to npm
on:
  workflow_dispatch: {}
  
permissions:
  id-token: write   # OIDC for provenance
  contents: read
      
jobs:
  publish:
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'

      # Pinned to a major: npm@latest is 12.x, which requires Node >=22.22.2.
      # npm 11 supports trusted publishing (OIDC, needs >=11.5.1) and runs on
      # Node 22. Never use npm@latest here — it breaks on each npm major.
      - name: Update npm
        run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      # --loglevel verbose surfaces npm's "oidc" messages. The OIDC helper never
      # throws: on failure it silently falls back to the placeholder _authToken
      # that setup-node writes, which surfaces only as an opaque 403.
      - run: npm publish --provenance --loglevel verbose
